<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-weight: bold; font-size: 22px; fill: #33261F; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #5c483d; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #33261F; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #6e584d; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1E4D46; }
    </style>
    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#33261F" flood-opacity="0.08" />
    </filter>

    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#1E4D46" />
    </marker>
    <marker id="arrowhead-warmth" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#D98A3D" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="580" rx="16" fill="#FAF1E4"/>
  <rect x="12" y="12" width="896" height="556" rx="12" fill="none" stroke="#33261F" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Header Section -->
  <text x="36" y="48" class="title">Rafeeq Care — System Architecture</text>
  <text x="36" y="68" class="subtitle">100% Static Angular 18+ Client hosted on GitHub Pages + Serverless Supabase Cloud Backend</text>

  <!-- 1. HOSTING LAYER (GitHub Pages) -->
  <g transform="translate(36, 95)">
    <rect width="250" height="105" rx="12" fill="#FFFFFF" stroke="#D98A3D" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="250" height="30" rx="12" fill="#D98A3D" fill-opacity="0.15"/>
    <text x="14" y="20" class="box-title" fill="#A85E15">🌐 Static Hosting Layer</text>
    
    <rect x="14" y="40" width="222" height="52" rx="8" fill="#FAF1E4" stroke="#33261F" stroke-opacity="0.1"/>
    <text x="24" y="60" class="node-text">GitHub Pages (gh-pages)</text>
    <text x="24" y="78" class="node-desc">Static HTML/JS/CSS bundle with Hash Routing</text>
  </g>

  <!-- 2. CLIENT LAYER (Angular 18+ App) -->
  <g transform="translate(36, 225)">
    <rect width="440" height="315" rx="12" fill="#FFFFFF" stroke="#1E4D46" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="440" height="32" rx="12" fill="#1E4D46" fill-opacity="0.15"/>
    <text x="16" y="22" class="box-title" fill="#1E4D46">📱 Client Layer (Angular 18+ PWA & Signals)</text>

    <!-- UI Components -->
    <rect x="16" y="45" width="408" height="68" rx="8" fill="#FAF1E4" stroke="#33261F" stroke-opacity="0.15"/>
    <text x="28" y="68" class="node-text">Standalone UI Components &amp; Views</text>
    <text x="28" y="86" class="node-desc">Wisdom Carousel · Attendants · Expenses · Respite · Diagnostics · Helplines · Gratitude</text>
    <text x="28" y="102" class="node-desc">Tailwind CSS Custom Palette (Canvas/Ink/Companion/Warmth/Hearth)</text>

    <!-- State & Routing -->
    <rect x="16" y="125" width="196" height="75" rx="8" fill="#FAF1E4" stroke="#33261F" stroke-opacity="0.15"/>
    <text x="26" y="148" class="node-text">Angular Signals State</text>
    <text x="26" y="166" class="node-desc">Injectable Services</text>
    <text x="26" y="184" class="node-desc">In-memory fallback data</text>

    <rect x="228" y="125" width="196" height="75" rx="8" fill="#FAF1E4" stroke="#33261F" stroke-opacity="0.15"/>
    <text x="238" y="148" class="node-text">Hash Router</text>
    <text x="238" y="166" class="node-desc">withHashLocation()</text>
    <text x="238" y="184" class="node-desc">GitHub Pages compatibility</text>

    <!-- Service Worker -->
    <rect x="16" y="212" width="408" height="58" rx="8" fill="#E8F1EC" stroke="#1E4D46" stroke-opacity="0.3"/>
    <text x="28" y="235" class="node-text">Service Worker (public/sw.js)</text>
    <text x="28" y="253" class="node-desc">Web Push notifications listener · Offline asset caching</text>

    <!-- Supabase JS Client -->
    <rect x="16" y="278" width="408" height="26" rx="6" fill="#1E4D46"/>
    <text x="140" y="295" font-family="sans-serif" font-size="11px" font-weight="700" fill="#FAF1E4">Supabase JS SDK (@supabase/supabase-js)</text>
  </g>

  <!-- 3. BACKEND LAYER (Supabase Cloud) -->
  <g transform="translate(540, 95)">
    <rect width="344" height="445" rx="12" fill="#FFFFFF" stroke="#33261F" stroke-opacity="0.2" stroke-width="2" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="344" height="32" rx="12" fill="#33261F" fill-opacity="0.08"/>
    <text x="16" y="22" class="box-title" fill="#33261F">⚡ Supabase Cloud Backend (Free Tier)</text>

    <!-- Auth -->
    <rect x="16" y="45" width="312" height="75" rx="8" fill="#FAF1E4" stroke="#33261F" stroke-opacity="0.15"/>
    <text x="28" y="68" class="node-text">Supabase Auth (Magic Link OTP)</text>
    <text x="28" y="86" class="node-desc">Passwordless authentication via Email OTP</text>
    <text x="28" y="104" class="node-desc">Configured Redirect URL to GitHub Pages</text>

    <!-- PostgreSQL DB + RLS -->
    <rect x="16" y="132" width="312" height="150" rx="8" fill="#FAF1E4" stroke="#33261F" stroke-opacity="0.15"/>
    <text x="28" y="155" class="node-text">PostgreSQL Database + Row Level Security</text>
    <text x="28" y="175" class="node-desc">• attendants &amp; expenses (v0.1)</text>
    <text x="28" y="193" class="node-desc">• respite_requests &amp; diagnostic_centers (v0.2)</text>
    <text x="28" y="211" class="node-desc">• helplines &amp; gratitude_entries (v0.3)</text>
    <text x="28" y="229" class="node-desc">• push_subscriptions (v0.3)</text>
    <rect x="28" y="244" width="288" height="24" rx="4" fill="#92AD87" fill-opacity="0.25"/>
    <text x="36" y="260" class="badge-text" fill="#2d4825">RLS Policies: Public SELECT + Auth INSERT/UPDATE</text>

    <!-- Edge Function -->
    <rect x="16" y="294" width="312" height="75" rx="8" fill="#E8F1EC" stroke="#1E4D46" stroke-opacity="0.4"/>
    <text x="28" y="317" class="node-text">Edge Function: send-reminder</text>
    <text x="28" y="335" class="node-desc">Deno / TypeScript serverless function</text>
    <text x="28" y="353" class="node-desc">Reads subscriptions &amp; dispatches web-push</text>

    <!-- Browser Push Service -->
    <rect x="16" y="380" width="312" height="50" rx="8" fill="#FAF1E4" stroke="#D98A3D" stroke-opacity="0.4"/>
    <text x="28" y="401" class="node-text">FCM / Web Push Cloud Gateway</text>
    <text x="28" y="417" class="node-desc">VAPID authenticated push delivery to mobile browsers</text>
  </g>

  <!-- Connectors & Flow Arrows -->
  <!-- Hosting to UI -->
  <path d="M 160 200 L 160 225" fill="none" stroke="#D98A3D" stroke-width="2" marker-end="url(#arrowhead-warmth)"/>
  
  <!-- Client SDK to Auth -->
  <path d="M 476 330 C 510 330, 510 180, 540 180" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="475" y="240" width="60" height="18" rx="4" fill="#FFFFFF" stroke="#1E4D46" stroke-opacity="0.3"/>
  <text x="480" y="253" class="arrow-text">Auth OTP</text>

  <!-- Client SDK to DB -->
  <path d="M 476 430 L 540 430" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="478" y="415" width="55" height="18" rx="4" fill="#FFFFFF" stroke="#1E4D46" stroke-opacity="0.3"/>
  <text x="484" y="428" class="arrow-text">REST/RLS</text>

  <!-- Client to Edge Function -->
  <path d="M 476 480 C 510 480, 510 420, 540 420" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Edge Function to FCM to Service Worker -->
  <path d="M 700 369 L 700 380" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 460 C 470 510, 430 510, 360 485" fill="none" stroke="#D98A3D" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-warmth)"/>
  <rect x="405" y="495" width="85" height="18" rx="4" fill="#FFFFFF" stroke="#D98A3D" stroke-opacity="0.4"/>
  <text x="410" y="508" class="arrow-text" fill="#A85E15">Push Notification</text>
</svg>
