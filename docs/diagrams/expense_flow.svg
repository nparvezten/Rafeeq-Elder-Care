<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-weight: bold; font-size: 20px; fill: #33261F; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #5c483d; }
      .actor-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #FAF1E4; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 11px; fill: #FFFFFF; }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #33261F; }
      .calc-box { font-family: monospace; font-size: 11px; fill: #1E4D46; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#1E4D46" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#2d4825" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="460" rx="16" fill="#FAF1E4"/>
  <rect x="12" y="12" width="836" height="436" rx="12" fill="none" stroke="#33261F" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="44" class="title">Shared Expense &amp; Net Balance Calculation Flow</text>
  <text x="36" y="64" class="subtitle">Expense entry persistence with client-side reactive arithmetic ("Who Owes Whom")</text>

  <!-- Lifelines -->
  <line x1="130" y1="130" x2="130" y2="410" stroke="#33261F" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="430" y1="130" x2="430" y2="410" stroke="#33261F" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="720" y1="130" x2="720" y2="410" stroke="#33261F" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Actors -->
  <rect x="60" y="85" width="140" height="42" rx="8" fill="#1E4D46"/>
  <text x="130" y="111" class="actor-box" text-anchor="middle">👤 Family Member</text>

  <rect x="330" y="85" width="200" height="42" rx="8" fill="#1E4D46"/>
  <text x="430" y="111" class="actor-box" text-anchor="middle">⚡ ExpenseService (Signal)</text>

  <rect x="620" y="85" width="200" height="42" rx="8" fill="#33261F"/>
  <text x="720" y="111" class="actor-box" text-anchor="middle">🗄️ Supabase PostgreSQL</text>

  <!-- Step 1 -->
  <path d="M 130 160 L 425 160" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="150" cy="150" r="10" fill="#1E4D46"/>
  <text x="150" y="154" class="step-num" text-anchor="middle">1</text>
  <text x="168" y="153" class="step-text">Log Expense: Description, Amount, Paid By, Split Between list</text>

  <!-- Step 2 -->
  <path d="M 430 205 L 715 205" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="450" cy="195" r="10" fill="#1E4D46"/>
  <text x="450" y="199" class="step-num" text-anchor="middle">2</text>
  <text x="468" y="198" class="step-text">INSERT into public.expenses (Supabase client)</text>

  <!-- Step 3 -->
  <path d="M 720 250 L 435 250" fill="none" stroke="#1E4D46" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <circle cx="690" cy="240" r="10" fill="#1E4D46"/>
  <text x="690" y="244" class="step-num" text-anchor="middle">3</text>
  <text x="468" y="243" class="step-text">Return saved record or fallback to local in-memory signal</text>

  <!-- Step 4: Reactive Calculation Box -->
  <rect x="360" y="280" width="340" height="60" rx="8" fill="#E8F1EC" stroke="#1E4D46" stroke-opacity="0.3"/>
  <circle cx="380" cy="300" r="10" fill="#1E4D46"/>
  <text x="380" y="304" class="step-num" text-anchor="middle">4</text>
  <text x="398" y="298" class="step-text">computed() reactive signal calculates net balances:</text>
  <text x="398" y="316" class="calc-box">share = amount / splitBetween.length</text>
  <text x="398" y="330" class="calc-box">netBalance[payer] += share; netBalance[split] -= share</text>

  <!-- Step 5 -->
  <path d="M 430 375 L 135 375" fill="none" stroke="#2d4825" stroke-width="2" marker-end="url(#arrow-green)"/>
  <circle cx="410" cy="365" r="10" fill="#2d4825"/>
  <text x="410" y="369" class="step-num" text-anchor="middle">5</text>
  <text x="160" y="368" class="step-text">UI updates instantly: Displays "Who Owes Whom" summary cards</text>
</svg>
