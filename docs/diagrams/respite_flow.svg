<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Fraunces', Georgia, serif; font-weight: bold; font-size: 20px; fill: #33261F; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #5c483d; }
      .actor-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #FAF1E4; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 11px; fill: #FFFFFF; }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #33261F; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#1E4D46" />
    </marker>
    <marker id="arrow-warmth" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#D98A3D" />
    </marker>
    <marker id="arrow-hearth" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#2d4825" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="#FAF1E4"/>
  <rect x="12" y="12" width="836" height="456" rx="12" fill="none" stroke="#33261F" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="44" class="title">Respite Care Coverage &amp; Claim Flow</text>
  <text x="36" y="64" class="subtitle">Caregiver shift coordination between family members</text>

  <!-- Lifelines -->
  <line x1="110" y1="130" x2="110" y2="430" stroke="#33261F" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="330" y1="130" x2="330" y2="430" stroke="#33261F" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="560" y1="130" x2="560" y2="430" stroke="#33261F" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="750" y1="130" x2="750" y2="430" stroke="#33261F" stroke-opacity="0.2" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Actors -->
  <rect x="35" y="85" width="150" height="42" rx="8" fill="#1E4D46"/>
  <text x="110" y="111" class="actor-box" text-anchor="middle">👤 Caregiver A (Req)</text>

  <rect x="240" y="85" width="180" height="42" rx="8" fill="#1E4D46"/>
  <text x="330" y="111" class="actor-box" text-anchor="middle">⚡ RespiteService</text>

  <rect x="470" y="85" width="180" height="42" rx="8" fill="#33261F"/>
  <text x="560" y="111" class="actor-box" text-anchor="middle">🗄️ public.respite_requests</text>

  <rect x="675" y="85" width="150" height="42" rx="8" fill="#D98A3D"/>
  <text x="750" y="111" class="actor-box" text-anchor="middle">👤 Caregiver B (Claim)</text>

  <!-- Step 1: Post Shift Request -->
  <path d="M 110 155 L 325 155" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="130" cy="145" r="10" fill="#1E4D46"/>
  <text x="130" y="149" class="step-num" text-anchor="middle">1</text>
  <text x="148" y="148" class="step-text">Post Coverage Request: Date, Time Range, Note</text>

  <!-- Step 2: DB Insert (Status = Open) -->
  <path d="M 330 195 L 555 195" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="350" cy="185" r="10" fill="#1E4D46"/>
  <text x="350" y="189" class="step-num" text-anchor="middle">2</text>
  <text x="368" y="188" class="step-text">INSERT record with status='open', claimed_by=null</text>

  <!-- Step 3: Display in Open Shifts -->
  <path d="M 330 240 L 745 240" fill="none" stroke="#D98A3D" stroke-width="2" marker-end="url(#arrow-warmth)"/>
  <circle cx="500" cy="230" r="10" fill="#D98A3D"/>
  <text x="500" y="234" class="step-num" text-anchor="middle">3</text>
  <text x="518" y="233" class="step-text">Open shift rendered in "Open Requests" with "Claim this"</text>

  <!-- Step 4: Claim Shift -->
  <path d="M 750 285 L 335 285" fill="none" stroke="#D98A3D" stroke-width="2" marker-end="url(#arrow-warmth)"/>
  <circle cx="730" cy="275" r="10" fill="#D98A3D"/>
  <text x="730" y="279" class="step-num" text-anchor="middle">4</text>
  <text x="440" y="278" class="step-text">Caregiver B clicks "Claim this" &amp; confirms name</text>

  <!-- Step 5: Update DB -->
  <path d="M 330 330 L 555 330" fill="none" stroke="#1E4D46" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="350" cy="320" r="10" fill="#1E4D46"/>
  <text x="350" y="324" class="step-num" text-anchor="middle">5</text>
  <text x="368" y="318" class="step-text">UPDATE status='claimed', claimed_by='Caregiver B'</text>

  <!-- Step 6: Board UI Updates for All -->
  <path d="M 330 380 L 115 380" fill="none" stroke="#2d4825" stroke-width="2" marker-end="url(#arrow-hearth)"/>
  <circle cx="280" cy="370" r="10" fill="#2d4825"/>
  <text x="280" y="374" class="step-num" text-anchor="middle">6</text>
  <text x="135" y="370" class="step-text">Shift moves to "Claimed Requests" displaying Caregiver B as coverage</text>
</svg>
